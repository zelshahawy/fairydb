name: Cargo Clippy and Format

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: rust-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Pin this to the same Rust version used locally.
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy,rustfmt

      - name: Print Rust versions
        run: |
          rustc --version
          cargo --version
          cargo clippy --version
          cargo fmt --version

      - name: Cargo check (no default features)
        run: cargo check --workspace --all-targets --verbose --no-default-features

      - name: Cargo check (all features)
        run: cargo check --workspace --all-targets --verbose --all-features

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (no default features)
        run: cargo clippy --workspace --all-targets --verbose --no-default-features -- -D warnings

      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --verbose --all-features -- -D warnings

  autofix_pr_branch:
    runs-on: ubuntu-latest
    needs: [check]

    # Run even if the check job failed, but only on PRs from this repository.
    if: >-
      ${{
        always() &&
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}

    permissions:
      contents: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy,rustfmt

      - name: Apply rustfmt
        run: cargo fmt --all

      # TempDir::keep() returns PathBuf directly.
      - name: Patch TempDir::into_path deprecation
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("src/common/src/physical/config.rs")

          if p.exists():
              s = p.read_text()

              s2 = s.replace(
                  "tempfile::tempdir().unwrap().into_path()",
                  "tempfile::tempdir().unwrap().keep()",
              )

              if s2 != s:
                  p.write_text(s2)
          PY

      - name: Apply Clippy fixes (no default features)
        continue-on-error: true
        run: |
          cargo clippy \
            --fix \
            --allow-dirty \
            --allow-staged \
            --workspace \
            --all-targets \
            --no-default-features

      - name: Apply Clippy fixes (all features)
        continue-on-error: true
        run: |
          cargo clippy \
            --fix \
            --allow-dirty \
            --allow-staged \
            --workspace \
            --all-targets \
            --all-features

      - name: Re-run rustfmt
        run: cargo fmt --all

      - name: Commit and push fixes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: rustfmt + clippy auto-fixes"
          branch: ${{ github.head_ref }}
