name: Cargo Clippy and Format (with Auto-fix PR)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: rust-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (fmt + clippy + cargo check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6 :contentReference[oaicite:1]{index=1}

      - name: Cache Cargo Registry and Target
        uses: actions/cache@v5 :contentReference[oaicite:2]{index=2}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust Stable Toolchain (clippy + rustfmt)
        uses: dtolnay/rust-toolchain@stable :contentReference[oaicite:3]{index=3}
        with:
          components: clippy,rustfmt

      - name: Cargo check (no default features)
        run: cargo check --workspace --all-targets --verbose --no-default-features

      - name: Cargo check (all features)
        run: cargo check --workspace --all-targets --verbose --all-features

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (no default features)
        run: cargo clippy --workspace --all-targets --verbose --no-default-features -- -D warnings

      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --verbose --all-features -- -D warnings

  autofix_pr:
    name: Auto-fix and open PR
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v6 :contentReference[oaicite:4]{index=4}
        with:
          fetch-depth: 0

      - name: Cache Cargo Registry and Target
        uses: actions/cache@v5 :contentReference[oaicite:5]{index=5}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust Stable Toolchain (clippy + rustfmt)
        uses: dtolnay/rust-toolchain@stable :contentReference[oaicite:6]{index=6}
        with:
          components: clippy,rustfmt

      - name: Apply rustfmt
        run: cargo fmt --all

      - name: Apply clippy auto-fixes (no default features)
        continue-on-error: true
        run: cargo clippy --fix --allow-dirty --allow-staged --workspace --all-targets --no-default-features :contentReference[oaicite:7]{index=7}

      - name: Apply clippy auto-fixes (all features)
        continue-on-error: true
        run: cargo clippy --fix --allow-dirty --allow-staged --workspace --all-targets --all-features :contentReference[oaicite:8]{index=8}

      - name: Re-run rustfmt after fixes
        run: cargo fmt --all

      - name: Create pull request with fixes
        uses: peter-evans/create-pull-request@v7 :contentReference[oaicite:9]{index=9}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ci/rust-lint-fixes
          delete-branch: true
          title: "chore: rustfmt + clippy auto-fixes"
          commit-message: "chore: rustfmt + clippy auto-fixes"
          body: |
            This PR was generated by CI.

            It applies:
            - cargo fmt --all
            - cargo clippy --fix (where possible)

            After merging, CI should be clean.
