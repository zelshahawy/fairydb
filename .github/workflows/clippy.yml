name: Cargo Clippy and Format (with Auto-fix)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: rust-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (fmt + clippy + check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache Cargo Registry and Target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust Stable Toolchain (clippy + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cargo check (no default features)
        run: cargo check --workspace --all-targets --verbose --no-default-features

      - name: Cargo check (all features)
        run: cargo check --workspace --all-targets --verbose --all-features

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (no default features)
        run: cargo clippy --workspace --all-targets --verbose --no-default-features -- -D warnings

      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --verbose --all-features -- -D warnings

  autofix_pr_branch:
    name: Auto-fix PR branch (same-repo PRs only)
    runs-on: ubuntu-latest
    needs: [check]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout PR branch (not the merge commit)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Cache Cargo Registry and Target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust Stable Toolchain (clippy + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Apply rustfmt
        run: cargo fmt --all

      # Your deprecation is not something clippy --fix reliably rewrites,
      # so patch this exact pattern to unblock -D warnings.
      - name: Patch TempDir::into_path deprecation (project-specific)
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src/common/src/physical/config.rs")
          if p.exists():
            s = p.read_text()
            old = "tempfile::tempdir().unwrap().into_path()"
            new = "tempfile::tempdir().unwrap().keep().unwrap()"
            if old in s:
              p.write_text(s.replace(old, new))
          PY

      - name: Apply clippy auto-fixes (no default features)
        continue-on-error: true
        run: cargo clippy --fix --allow-dirty --allow-staged --workspace --all-targets --no-default-features

      - name: Apply clippy auto-fixes (all features)
        continue-on-error: true
        run: cargo clippy --fix --allow-dirty --allow-staged --workspace --all-targets --all-features

      - name: Re-run rustfmt after fixes
        run: cargo fmt --all

      - name: Commit and push fixes back to the PR branch
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: rustfmt + clippy auto-fixes"
          branch: ${{ github.head_ref }}
