name: Cargo Clippy and Format (with Auto-fix)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: rust-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - run: cargo check --workspace --all-targets --verbose --no-default-features
      - run: cargo check --workspace --all-targets --verbose --all-features
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --verbose --no-default-features -- -D warnings
      - run: cargo clippy --workspace --all-targets --verbose --all-features -- -D warnings

  autofix_pr_branch:
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - name: Checkout PR branch (head), so we can push back
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Apply rustfmt
        run: cargo fmt --all

      # Fix your known deprecation explicitly (clippy --fix may not rewrite this one).
      - name: Patch TempDir::into_path deprecation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src/common/src/physical/config.rs")
          if p.exists():
              s = p.read_text()
              s2 = s.replace(
                  "tempfile::tempdir().unwrap().into_path()",
                  "tempfile::tempdir().unwrap().keep().unwrap()",
              )
              if s2 != s:
                  p.write_text(s2)
          PY

      - name: Apply clippy fixes (no default features)
        continue-on-error: true
        run: cargo clippy --fix --allow-dirty --allow-staged --workspace --all-targets --no-default-features

      - name: Apply clippy fixes (all features)
        continue-on-error: true
        run: cargo clippy --fix --allow-dirty --allow-staged --workspace --all-targets --all-features

      - name: Re-run rustfmt after fixes
        run: cargo fmt --all

      - name: Commit and push fixes back to PR branch
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: rustfmt + clippy auto-fixes"
          branch: ${{ github.head_ref }}
